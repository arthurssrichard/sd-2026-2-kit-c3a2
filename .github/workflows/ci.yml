# CI/CD da plataforma (extensão do edital): a cada commit, testes de fumaça
# rodam em contêiner; em push na main, a publicação no GHCR é opcional.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Testes unitários (resiliência e segurança)
        run: |
          pip install pytest requests pyjwt
          python -m pytest -q

      - name: Sobe o sistema INTEIRO com UM comando
        run: docker compose up --build --wait --wait-timeout 120

      - name: Teste de fumaça (fluxo completo gateway->fila->worker->vetorial)
        run: JAEGER_URL=http://localhost:16686 python scripts/fumaca.py

      - name: Confere fallback e abertura do circuito sem inferência
        run: |
          docker compose stop inferencia
          FALHA_INFERENCIA=1 python scripts/fumaca.py

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200

  publicar:
    permissions:
      contents: read
      packages: write
    needs: testes
    if: vars.PUBLICAR_GHCR == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publicação das imagens (um Dockerfile por serviço)
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          for SVC in gateway inferencia worker autoescalador; do
            docker build -f $SVC/Dockerfile \
              -t "ghcr.io/$OWNER/$SVC:$GITHUB_SHA" \
              -t "ghcr.io/$OWNER/$SVC:latest" .
            docker push "ghcr.io/$OWNER/$SVC:$GITHUB_SHA"
            docker push "ghcr.io/$OWNER/$SVC:latest"
          done
