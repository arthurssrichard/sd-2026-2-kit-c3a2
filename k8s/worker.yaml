# Worker de fila (escalonado por fila via KEDA — k8s/keda-scaledobject.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: plataforma
spec:
  replicas: 1
  selector: {matchLabels: {app: worker}}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: ghcr.io/SEU_USUARIO/worker:latest   # publicado pelo CI (GHCR)
          ports: [{containerPort: 8002}]
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: URL_INFERENCIA
              value: http://inferencia:8001
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
          readinessProbe:
            httpGet: {path: /saude, port: 8002}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: plataforma
spec:
  selector: {app: worker}
  ports: [{port: 8002, targetPort: 8002}]
