# Segredos — crie a partir do exemplo ANTES de aplicar o gateway:
#   kubectl create namespace plataforma
#   kubectl -n plataforma create secret generic plataforma-segredos \
#     --from-literal=jwt-segredo='UM-SEGREDO-SEGURO' \
#     --from-literal=usuarios='aluno:senhaForte1,maria:senhaForte2'
apiVersion: v1
kind: Secret
metadata:
  name: plataforma-segredos
  namespace: plataforma
type: Opaque
stringData:
  jwt-segredo: "TROQUE-PELO-SEGREDO-REAL"
  usuarios: "aluno:TROQUE-A-SENHA"
