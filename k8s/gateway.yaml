# API Gateway — porta de entrada pública (HTTPS via Ingress na Aula 16)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: plataforma
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata:
      labels: {app: gateway}
    spec:
      containers:
        - name: gateway
          image: ghcr.io/SEU_USUARIO/gateway:latest   # publicado pelo CI (GHCR)
          ports: [{containerPort: 8000}]
          env:
            - name: URL_INFERENCIA
              value: http://inferencia:8001
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: JWT_SEGREDO
              valueFrom:
                secretKeyRef: {name: plataforma-segredos, key: jwt-segredo}
            - name: USUARIOS
              valueFrom:
                secretKeyRef: {name: plataforma-segredos, key: usuarios}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://jaeger:4318
          readinessProbe:
            httpGet: {path: /saude, port: 8000}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: plataforma
spec:
  type: ClusterIP
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8000}]
