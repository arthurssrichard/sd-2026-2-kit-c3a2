# ============================================================================
# Plataforma de IA como Serviço — C3.A2 (Sistemas Distribuídos e Computação em Nuvem)
#
# O sistema INTEIRO sobe com UM comando (item 3 do edital):
#     docker compose up --build
#
# Os serviços se referenciam pelo NOME (inferencia, redis, qdrant, jaeger...)
# e nunca por IP fixo — isso é descoberta de serviços (Aula 14).
#
# Portas locais (loopback): gateway, Jaeger, Prometheus, Grafana e recomendador.
# Inferência (8001) e worker (8002) ficam INTERNOS: o acesso é sempre
# pelo gateway — bom padrão de plataforma.
# ============================================================================
name: plataforma-ia

x-logs: &logs
  driver: json-file
  options: {max-size: "10m", max-file: "2"}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "${REDIS_MEMORIA_MAXIMA:-128mb}", "--maxmemory-policy", "noeviction"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  qdrant:
    # Armazenamento vetorial (item 2 do edital): memória semântica das tarefas.
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - memoria-vetorial:/qdrant/storage

  jaeger:
    # Rastreamento distribuído (item 7 do edital): traces gateway->fila->worker.
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports: ["127.0.0.1:16686:16686"]

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # dev local — troque em produção
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]

  inferencia:
    logging: *logs
    build:
      context: .
      dockerfile: inferencia/Dockerfile
      args: {VETOR_DIM: "${VETOR_DIM:-32}"}
    restart: unless-stopped
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      - VETOR_DIM=${VETOR_DIM:-32}
    depends_on: [jaeger]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/saude"]
      interval: 5s
      timeout: 2s
      retries: 12

  worker:
    logging: *logs
    build: {context: ., dockerfile: worker/Dockerfile}
    restart: unless-stopped
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - URL_INFERENCIA=${URL_INFERENCIA:-http://inferencia:8001}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - FILA_CHAVE=${FILA_CHAVE:-fila:tarefas}
      - VETOR_DIM=${VETOR_DIM:-32}
      - TAREFA_TTL_SEGUNDOS=${TAREFA_TTL_SEGUNDOS:-3600}
      - MAX_REENTREGAS=${MAX_REENTREGAS:-3}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      redis: {condition: service_healthy}
      inferencia: {condition: service_healthy}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/saude || exit 1"]
      interval: 10s
      retries: 5

  gateway:
    logging: *logs
    build: {context: ., dockerfile: gateway/Dockerfile}
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    environment:
      - URL_INFERENCIA=${URL_INFERENCIA:-http://inferencia:8001}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - QDRANT_URL=${QDRANT_URL:-http://qdrant:6333}
      - FILA_CHAVE=${FILA_CHAVE:-fila:tarefas}
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo}
      - JWT_EXPIRA_MINUTOS=${JWT_EXPIRA_MINUTOS:-120}
      - USUARIOS=${USUARIOS:-aluno:aluno123}
      - LIMITE_POR_MINUTO=${LIMITE_POR_MINUTO:-30}
      - TAREFA_TTL_SEGUNDOS=${TAREFA_TTL_SEGUNDOS:-3600}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    depends_on:
      inferencia: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude', timeout=2)"]
      interval: 10s
      retries: 5

  autoescalador:
    build: {context: ., dockerfile: autoescalador/Dockerfile}
    ports: ["127.0.0.1:8003:8000"]
    environment:
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - FILA_CHAVE=${FILA_CHAVE:-fila:tarefas}
      - LIMIAR_FILA_POR_WORKER=${LIMIAR_FILA_POR_WORKER:-10}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - AUTOESCALADOR_INTERVALO_S=${AUTOESCALADOR_INTERVALO_S:-15}
    depends_on:
      redis: {condition: service_healthy}

volumes:
  memoria-vetorial:
