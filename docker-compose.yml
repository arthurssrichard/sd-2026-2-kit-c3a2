# ============================================================================
# Plataforma de IA como Serviço — C3.A2 (Sistemas Distribuídos e Computação em Nuvem)
#
# O sistema INTEIRO sobe com UM comando (item 3 do edital):
#     docker compose up --build
#
# Os serviços se referenciam pelo NOME (inferencia, redis, qdrant, jaeger...)
# e nunca por IP fixo — isso é descoberta de serviços (Aula 14).
#
# Portas públicas (host): gateway 8000 · qdrant 6333 · jaeger 16686 ·
# prometheus 9090 · grafana 3000 · autoescalador 8003
# Inferência (8001) e worker (8002) ficam INTERNOS: o acesso é sempre
# pelo gateway — bom padrão de plataforma.
# ============================================================================
name: plataforma-ia

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]  # AOF: sobrevive a restarts (trade-off: custo de I/O)
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  qdrant:
    # Armazenamento vetorial (item 2 do edital): memória semântica das tarefas.
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
    # Sem healthcheck de imagem: o worker é resiliente e retenta sozinho.

  jaeger:
    # Rastreamento distribuído (item 7 do edital): traces gateway->fila->worker.
    image: jaegertracing/all-in-one:1.57
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports: ["16686:16686"]  # UI: http://localhost:16686

  prometheus:
    image: prom/prometheus:v2.53.1
    volumes:
      - ./observabilidade/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin  # dev local — troque em produção
    volumes:
      - ./observabilidade/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observabilidade/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  inferencia:
    build: {context: ., dockerfile: inferencia/Dockerfile}
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
      - VETOR_DIM=${VETOR_DIM:-32}
      - LLM_API_KEY=${LLM_API_KEY:-}          # opcional: sem chave, modo simulado
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.openai.com/v1}
    depends_on: [jaeger]

  worker:
    build: {context: ., dockerfile: worker/Dockerfile}
    environment:
      - REDIS_URL=redis://redis:6379/0
      - URL_INFERENCIA=http://inferencia:8001
      - QDRANT_URL=http://qdrant:6333
      - VETOR_DIM=${VETOR_DIM:-32}
      - TAREFA_TTL_SEGUNDOS=${TAREFA_TTL_SEGUNDOS:-3600}
      - MAX_REENTREGAS=${MAX_REENTREGAS:-3}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      redis: {condition: service_healthy}
      inferencia: {condition: service_started}
      qdrant: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8002/saude || exit 1"]
      interval: 10s
      retries: 5

  gateway:
    build: {context: ., dockerfile: gateway/Dockerfile}
    ports: ["8000:8000"]
    environment:
      - URL_INFERENCIA=http://inferencia:8001
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - JWT_SEGREDO=${JWT_SEGREDO:-troque-este-segredo}
      - JWT_EXPIRA_MINUTOS=${JWT_EXPIRA_MINUTOS:-120}
      - USUARIOS=${USUARIOS:-aluno:aluno123}
      - LIMITE_POR_MINUTO=${LIMITE_POR_MINUTO:-30}
      - TAREFA_TTL_SEGUNDOS=${TAREFA_TTL_SEGUNDOS:-3600}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4318
    depends_on:
      inferencia: {condition: service_started}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/saude || exit 1"]
      interval: 10s
      retries: 5

  autoescalador:
    build: {context: ., dockerfile: autoescalador/Dockerfile}
    ports: ["8003:8000"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - FILA_CHAVE=fila:tarefas
      - LIMIAR_FILA_POR_WORKER=${LIMIAR_FILA_POR_WORKER:-10}
      - MAX_WORKERS=${MAX_WORKERS:-4}
      - AUTOESCALADOR_INTERVALO_S=${AUTOESCALADOR_INTERVALO_S:-15}
    depends_on:
      redis: {condition: service_healthy}
